{{- if and (not (.Values.global.objectStorage).acknowledgeMinioRemoval) (lookup "apps/v1" "StatefulSet" .Release.Namespace "minio-cache") }}
{{- fail "The bundled MinIO object store was replaced by RustFS. This upgrade deletes the StatefulSet minio-cache and does not migrate its data: cache entries stored before the upgrade become unavailable, and the PVC minio-cache-storage-minio-cache-0 stays behind unused until you delete it. To proceed, set global.objectStorage.acknowledgeMinioRemoval=true." }}
{{- end }}
{{- if hasKey .Values.global.cache.local "version" }}
{{- fail "global.cache.local.version was replaced by global.cache.local.image.{repository,tag}" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: job-extra-environment
  namespace: {{ .Release.Namespace }}
data:
  SEMAPHORE_TOOLBOX_VERSION: {{ .Values.toolbox.version | b64enc }}
{{- if .Values.global.cache.local.enabled }}
{{- $creds := include "semaphore.objectStore.credentials" (dict "root" . "store" .Values.global.cache "key" "cache") | fromJson }}
  SEMAPHORE_CACHE_BACKEND: {{ printf "s3" | b64enc }}
  SEMAPHORE_CACHE_S3_URL: {{ printf "http://storage-cache:9000" | b64enc }}
  SEMAPHORE_CACHE_S3_BUCKET: {{ printf "semaphore-cache" | b64enc }}
  SEMAPHORE_CACHE_S3_KEY: {{ $creds.accessKey | b64enc }}
  SEMAPHORE_CACHE_S3_SECRET: {{ $creds.secretKey | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.cache.secretName }}
  namespace: {{ .Release.Namespace }}
stringData:
  AWS_ACCESS_KEY_ID: {{ $creds.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.secretKey | quote }}
---
{{ include "semaphore.objectStore" (dict "root" . "name" "storage-cache" "bucket" "semaphore-cache" "key" "cache" "store" .Values.global.cache) }}
{{- end }}
