{{- if and (not .Values.global.objectStorage.acknowledgeMinioRemoval) (lookup "apps/v1" "StatefulSet" .Release.Namespace "minio-logs") }}
{{- fail "The bundled MinIO object store was replaced by RustFS. This upgrade deletes the StatefulSet minio-logs and does not migrate its data: job logs stored before the upgrade become unavailable, and the PVC minio-logs-storage-minio-logs-0 stays behind unused until you delete it. To proceed, set global.objectStorage.acknowledgeMinioRemoval=true." }}
{{- end }}
{{- if hasKey .Values.global.logs.local "version" }}
{{- fail "global.logs.local.version was replaced by global.logs.local.image.{repository,tag}" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.logs.secretName }}
  namespace: {{ .Release.Namespace }}
stringData:
  LOGS_STORAGE_BACKEND: "s3"
  LOGS_STORAGE_S3_URL: "https://logs.{{.Values.global.domain.name}}"
  AWS_REGION: {{ .Values.global.logs.region | quote }}
  S3_BUCKET_NAME: "semaphore-logs"
  AWS_ACCESS_KEY_ID: {{ .Values.global.logs.username | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.global.logs.password | quote }}
{{- if .Values.global.logs.local.enabled }}
---
{{ include "semaphore.objectStore" (dict "root" . "name" "storage-logs" "bucket" "semaphore-logs" "store" .Values.global.logs) }}
{{- end }}