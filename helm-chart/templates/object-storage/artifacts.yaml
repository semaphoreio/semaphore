{{- if and (not (.Values.global.objectStorage).acknowledgeMinioRemoval) (lookup "apps/v1" "StatefulSet" .Release.Namespace "minio-artifacts") }}
{{- fail "The bundled MinIO object store was replaced by RustFS. This upgrade deletes the StatefulSet minio-artifacts and does not migrate its data: artifacts stored before the upgrade become unavailable, and the PVC minio-artifacts-storage-minio-artifacts-0 stays behind unused until you delete it. To proceed, set global.objectStorage.acknowledgeMinioRemoval=true." }}
{{- end }}
{{- if hasKey .Values.global.artifacts.local "version" }}
{{- fail "global.artifacts.local.version was replaced by global.artifacts.local.image.{repository,tag}" }}
{{- end }}
{{- $creds := include "semaphore.objectStore.credentials" (dict "root" . "store" .Values.global.artifacts "key" "artifacts") | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.artifacts.secretName }}
  namespace: {{ .Release.Namespace }}
stringData:
  ARTIFACT_STORAGE_BACKEND: "s3"
  ARTIFACT_STORAGE_S3_URL: "https://artifacts.{{.Values.global.domain.name}}"
  AWS_REGION: {{ .Values.global.artifacts.region | quote }}
  ARTIFACT_STORAGE_S3_BUCKET: "semaphore-artifacts"
  AWS_ACCESS_KEY_ID: {{ $creds.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.secretKey | quote }}
{{- if .Values.global.artifacts.local.enabled }}
---
{{ include "semaphore.objectStore" (dict "root" . "name" "storage-artifacts" "bucket" "semaphore-artifacts" "key" "artifacts" "store" .Values.global.artifacts "extraEnv" (list (dict "name" "RUSTFS_CORS_ALLOWED_ORIGINS" "value" "*"))) }}
{{- end }}