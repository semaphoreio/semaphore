---
image: github_notifier
imageTag: latest

consumer:
  # Must stay 1. Commit-status ordering is enforced in-process (per-check
  # serialization and the stale-pending guard live in pod-local state), so a
  # second consumer pod could deliver statuses out of order. Chart rendering
  # fails if this is raised.
  replicas: 1
  logs:
    level: info
  resources:
    limits:
      cpu: '0.2'
      memory: 300Mi
    requests:
      cpu: '0.03'
      memory: 100Mi

api:
  replicas: 1
  resources:
    limits:
      cpu: '0.3'
      memory: 300Mi
    requests:
      cpu: '0.03'
      memory: 100Mi

statsd:
  resources:
    limits:
      cpu: "20m"
      memory: "50Mi"
    requests:
      cpu: "5m"
      memory: "25Mi"
